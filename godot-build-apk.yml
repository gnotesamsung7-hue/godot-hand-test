name: Build hand test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download the hand model into the plugin
        run: |
          mkdir -p android-plugin/plugin/src/main/assets
          curl -fsSL -o android-plugin/plugin/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Build the HandTracker plugin
        working-directory: android-plugin
        run: |
          gradle :plugin:assembleRelease --no-daemon
          mkdir -p ../game/addons/HandTracker/bin
          cp plugin/build/outputs/aar/HandTracker-release.aar ../game/addons/HandTracker/bin/

      - name: Install Godot and its export templates
        run: |
          cd /tmp
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Point Godot at the Android SDK and Java
        working-directory: game
        run: |
          godot --headless --editor --quit || true
          python3 - <<'PY'
          import glob, os, re
          files = glob.glob(os.path.expanduser('~/.config/godot/editor_settings-4*.tres'))
          path = files[0]
          s = open(path).read()
          want = {
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
          }
          for k, v in want.items():
              line = f'{k} = "{v}"'
              if re.search('^' + re.escape(k) + ' = .*$', s, re.M):
                  s = re.sub('^' + re.escape(k) + ' = .*$', line, s, flags=re.M)
              else:
                  s = s.rstrip('\n') + '\n' + line + '\n'
          open(path, 'w').write(s)
          print(path)
          print('\n'.join(l for l in s.splitlines() if 'export/android' in l))
          PY

      - name: Export the APK
        working-directory: game
        run: |
          godot --headless --import || true
          godot --headless --install-android-build-template --export-debug "Android" ../hand-test.apk
          ls -la ../hand-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hand-test-apk
          path: hand-test.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest hand-test.apk \
            --target "$GITHUB_SHA" \
            --title "Godot hand test APK (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. On your phone, tap hand-test.apk to download and install."
